<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">

        <defs>
            <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#6366F1" />
                <stop offset="100%" stop-color="#8B5CF6" />
            </linearGradient>
            <linearGradient id="secondary-grad" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#8B5CF6" />
                <stop offset="100%" stop-color="#6366F1" />
            </linearGradient>
        </defs>
    <!-- Icon aligned to left -->
    <g transform="translate(30, 40) scale(0.3)">

        <g id="mg-mark" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <!-- Left Soundwave / Stem of M -->
            <path id="left-stem" d="M 100 320 L 100 100 L 200 200" stroke="url(#primary-grad)" />
            <!-- Right Soundwave / M to G Loop -->
            <path id="right-stem-g" d="M 200 200 L 300 100 L 300 260 A 60 60 0 0 1 180 260 L 180 220" stroke="url(#secondary-grad)" />
            <!-- Lyric Sync Lines -->
            <g id="lyric-lines" stroke="#06B6D4">
                <path id="lyric-left" d="M 40 160 L 100 160" />
                <path id="lyric-right" d="M 180 220 L 360 220" />
            </g>
        </g>
    </g>
    <!-- Typography -->
    <text x="180" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#FFFFFF" letter-spacing="-1">MG Lyrics</text>
    <text x="495" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="400" fill="#71717A" letter-spacing="-1">Player</text>
</svg>
